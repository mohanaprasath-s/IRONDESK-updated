<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IronDesk — Gym Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #161619;
    --panel-2: #1c1c20;
    --line: #27272c;
    --line-2: #34343a;
    --text: #f4f3f0;
    --muted: #8e8e96;
    --faint: #5e5e66;
    --accent: #ff5a34;
    --accent-2: #ff8a3d;
    --accent-soft: rgba(255, 90, 52, 0.12);
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(900px 500px at 85% -10%, rgba(255, 90, 52, 0.10), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: Inter, system-ui, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: inherit; font-size: 14px; }
  svg { display: block; }

  /* ================= Layout ================= */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 244px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 26px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #1a1a1a;
    box-shadow: 0 6px 18px rgba(255, 90, 52, 0.35);
  }
  .brand-name {
    font-family: "Barlow Condensed", Inter, sans-serif;
    font-size: 27px; font-weight: 700; letter-spacing: 0.5px; line-height: 1;
  }
  .brand-name span { color: var(--accent); }
  .brand-sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 3px; }

  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-btn {
    display: flex; align-items: center; gap: 12px;
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 11px 12px; border-radius: 10px; cursor: pointer; text-align: left;
    font-weight: 500; transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-btn:hover { background: var(--panel-2); color: var(--text); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(255, 90, 52, 0.25); font-weight: 600; }
  .nav-btn .badge-count {
    margin-left: auto; background: var(--amber); color: #1a1a1a;
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  }

  .sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .user-chip .avatar { width: 34px; height: 34px; font-size: 13px; }
  .user-chip b { display: block; font-size: 13px; }
  .user-chip small { color: var(--muted); font-size: 11px; }

  .content { flex: 1; min-width: 0; padding: 28px 34px 60px; max-width: 1280px; }

  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .topbar h2 { margin: 0; font-family: "Barlow Condensed", Inter, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.05; }
  .topbar p { margin: 5px 0 0; color: var(--muted); }
  .topbar-actions { display: flex; gap: 10px; }

  /* ================= Buttons ================= */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text);
    padding: 9px 15px; border-radius: 10px; cursor: pointer; font-weight: 600;
    transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: #25252a; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #1a1a1a;
    box-shadow: 0 6px 16px rgba(255, 90, 52, 0.25);
  }
  .btn.primary:hover { opacity: 0.92; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: var(--red); border-color: transparent; color: #1a1a1a; }
  .btn.small { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: none; border: 1px solid transparent; border-radius: 9px; color: var(--muted); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  .icon-btn.del:hover { color: var(--red); background: rgba(248, 113, 113, 0.1); }

  /* ================= Cards / panels ================= */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
  .panel-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .panel-head small { color: var(--muted); }

  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; position: relative; overflow: hidden; transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .stat-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
  .stat-card .ico {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px;
  }
  .stat-card .label { color: var(--muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-card .value { font-size: 30px; font-weight: 700; margin-top: 4px; letter-spacing: -0.5px; }
  .stat-card .sub { color: var(--faint); font-size: 12px; margin-top: 4px; }
  .ico.orange { background: var(--accent-soft); color: var(--accent); }
  .ico.green { background: rgba(74, 222, 128, 0.12); color: var(--green); }
  .ico.amber { background: rgba(251, 191, 36, 0.12); color: var(--amber); }
  .ico.blue { background: rgba(96, 165, 250, 0.12); color: var(--blue); }

  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-2.even { grid-template-columns: 1fr 1fr; }

  /* ================= Revenue chart ================= */
  .chart { display: flex; align-items: flex-end; gap: 14px; height: 220px; padding-top: 10px; }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; }
  .chart-val { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .chart-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .chart-bar {
    width: 100%; max-width: 54px; border-radius: 8px 8px 3px 3px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    transform-origin: bottom; animation: grow 0.6s cubic-bezier(.2,.8,.2,1);
    min-height: 4px;
  }
  .chart-bar.zero { background: var(--line-2); }
  .chart-bar.current { box-shadow: 0 0 22px rgba(255, 90, 52, 0.35); }
  .chart-label { font-size: 12px; color: var(--muted); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  /* ================= Donut ================= */
  .donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .donut { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .donut-hole {
    width: 104px; height: 104px; border-radius: 50%; background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-hole b { font-size: 28px; line-height: 1; }
  .donut-hole span { color: var(--muted); font-size: 11px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .legend { display: flex; flex-direction: column; gap: 10px; min-width: 130px; }
  .legend-row { display: flex; align-items: center; gap: 9px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .legend-row .n { margin-left: auto; font-weight: 600; padding-left: 14px; }

  /* ================= Lists ================= */
  .list { display: flex; flex-direction: column; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; padding-bottom: 0; }
  .list-row:first-child { padding-top: 0; }
  .list-main { flex: 1; min-width: 0; }
  .list-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-main small { color: var(--muted); }
  .amount { font-weight: 700; }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff;
  }

  /* ================= Toolbar / chips ================= */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    display: flex; align-items: center; gap: 9px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 12px; flex: 1 1 240px; max-width: 360px; color: var(--muted);
    transition: border-color 0.15s ease;
  }
  .search:focus-within { border-color: var(--accent); }
  .search input { background: none; border: none; outline: none; color: var(--text); padding: 10px 0; width: 100%; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    padding: 7px 13px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 13px;
    transition: all 0.15s ease;
  }
  .chip:hover { color: var(--text); border-color: var(--line-2); }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(255, 90, 52, 0.35); }
  .chip em { font-style: normal; opacity: 0.7; margin-left: 4px; }

  /* ================= Table ================= */
  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 13px 16px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--faint); text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; font-weight: 600; background: var(--panel); }
  tbody tr { transition: background 0.15s ease; animation: fadeIn 0.25s ease; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: none; }
  td.actions { text-align: right; }
  .cell-person { display: flex; align-items: center; gap: 12px; }
  .cell-person b { display: block; font-weight: 600; }
  .cell-person small { color: var(--muted); }
  .muted { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 46px 20px; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }
  .empty b { display: block; color: var(--text); margin-bottom: 4px; }

  /* ================= Pills ================= */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.active { background: rgba(74, 222, 128, 0.12); color: var(--green); }
  .pill.expiring { background: rgba(251, 191, 36, 0.12); color: var(--amber); }
  .pill.expired { background: rgba(248, 113, 113, 0.12); color: var(--red); }
  .plan-tag { padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--line-2); }
  .mode-tag { padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); }

  /* ================= Trainer cards ================= */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .trainer-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; text-align: center; position: relative; transition: transform 0.2s ease, border-color 0.2s ease;
    animation: fadeIn 0.25s ease;
  }
  .trainer-card:hover { transform: translateY(-3px); border-color: var(--line-2); }
  .trainer-card .avatar { width: 64px; height: 64px; font-size: 22px; margin: 0 auto 14px; }
  .trainer-card h4 { margin: 0; font-size: 16px; }
  .trainer-card p { margin: 5px 0 0; color: var(--muted); }
  .trainer-card .icon-btn { position: absolute; top: 10px; right: 10px; }

  .mini-stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .mini-stats .panel { flex: 1 1 180px; padding: 16px 18px; }
  .mini-stats .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .mini-stats .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

  /* ================= Modal ================= */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
    display: grid; place-items: center; z-index: 100; padding: 16px; animation: fadeOnly 0.15s ease;
  }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; width: 100%; max-width: 440px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); animation: pop 0.2s cubic-bezier(.2,.9,.3,1.2);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 22px 6px; }
  .modal-head h3 { margin: 0; font-size: 19px; }
  .modal-head p { margin: 4px 0 0; color: var(--muted); }
  .modal-body { padding: 14px 22px 6px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot { padding: 18px 22px 22px; display: flex; justify-content: flex-end; gap: 10px; }

  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text);
    padding: 11px 12px; border-radius: 10px; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .info-box { background: var(--panel-2); border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 14px; color: var(--muted); }
  .info-box b { color: var(--text); }

  /* ================= Toasts ================= */
  #toast-container { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 300; }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line-2); border-left: 4px solid var(--accent);
    padding: 13px 16px; border-radius: 10px; min-width: 240px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    animation: slideIn 0.25s ease;
  }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }

  /* ================= Responsive ================= */
  @media (max-width: 1050px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-2.even { grid-template-columns: 1fr; }
  }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar {
      position: fixed; bottom: 0; left: 0; right: 0; top: auto; width: 100%; height: auto; z-index: 50;
      flex-direction: row; padding: 8px 10px; border-right: none; border-top: 1px solid var(--line);
    }
    .brand, .sidebar-foot { display: none; }
    .nav { flex-direction: row; width: 100%; justify-content: space-around; }
    .nav-btn { flex-direction: column; gap: 4px; font-size: 11px; padding: 7px 10px; flex: 1; align-items: center; }
    .nav-btn .badge-count { display: none; }
    .content { padding: 20px 16px 100px; }
    .topbar h2 { font-size: 30px; }
    .mobile-logout { display: inline-flex !important; }
    #toast-container { bottom: 90px; right: 12px; left: 12px; }
  }
  .mobile-logout { display: none; }
  @media (max-width: 520px) {
    .stats { grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { padding: 14px; }
    .stat-card .value { font-size: 24px; }
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brand-icon"></div>
      <div>
        <div class="brand-name">Iron<span>Desk</span></div>
        <div class="brand-sub">Gym Management</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" style="background:linear-gradient(135deg,#ff5a34,#ff8a3d);color:#1a1a1a">A</div>
        <div><b>Admin</b><small>Owner</small></div>
      </div>
      <button class="icon-btn" id="logout-btn" title="Log out"></button>
    </div>
  </aside>

  <!-- ============ Main content ============ -->
  <main class="content">

    <div class="topbar">
      <div>
        <h2 id="page-title">Dashboard</h2>
        <p id="page-sub"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <!-- DASHBOARD -->
    <section id="page-dashboard" class="page active">
      <div class="stats" id="stats"></div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3>Revenue — last 6 months</h3><small id="chart-total"></small></div>
          <div class="chart" id="chart"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Plan mix</h3></div>
          <div class="donut-wrap" id="donut"></div>
        </div>
      </div>

      <div class="grid-2 even">
        <div class="panel">
          <div class="panel-head"><h3>Needs attention</h3><small>Expiring &amp; expired</small></div>
          <div class="list" id="attention-list"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Recent payments</h3><button class="btn small ghost" data-go="payments">View all</button></div>
          <div class="list" id="recent-payments"></div>
        </div>
      </div>
    </section>

    <!-- MEMBERS -->
    <section id="page-members" class="page">
      <div class="toolbar">
        <label class="search">
          <span id="search-icon"></span>
          <input id="member-search" placeholder="Search by name or phone">
        </label>
        <div class="chips" id="member-chips"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Member</th><th>Plan</th><th>Expires</th><th>Status</th><th></th></tr></thead>
          <tbody id="members-table"></tbody>
        </table>
      </div>
    </section>

    <!-- TRAINERS -->
    <section id="page-trainers" class="page">
      <div class="cards" id="trainers-grid"></div>
    </section>

    <!-- PAYMENTS -->
    <section id="page-payments" class="page">
      <div class="mini-stats" id="payment-stats"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Member</th><th>Amount</th><th>Date</th><th>Mode</th></tr></thead>
          <tbody id="payments-table"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<div id="toast-container"></div>

<script>
/* =====================================================================
   IronDesk — frontend
   Talks to server.js through the same /api/... routes as before.
   ===================================================================== */

var API_URL = (location.protocol === "file:") ? "http://localhost:3000" : "";
var token = localStorage.getItem("token");
if (!token) { window.location.replace("login.html"); }

function logout() {
  fetch(API_URL + "/api/logout", { method: "POST", headers: { "Authorization": "Bearer " + token } })
    .catch(function () {})
    .finally(function () {
      localStorage.removeItem("token");
      window.location.replace("login.html");
    });
}

/* ---------- Icons (inline SVG so nothing extra to download) ---------- */
function svg(path, size) {
  size = size || 18;

}

/* ---------- Small helpers ---------- */
function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function money(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
function initials(name) {
  var parts = String(name || "?").trim().split(/\s+/);
  return ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}
function avatarColor(name) {
  var h = 0, s = String(name || "");
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return "linear-gradient(135deg, hsl(" + h + " 55% 42%), hsl(" + ((h + 40) % 360) + " 60% 32%))";
}
function avatar(name, extraClass) {
  return '<div class="avatar ' + (extraClass || "") + '" style="background:' + avatarColor(name) + '">' + esc(initials(name)) + '</div>';
}

/* ---------- Dates (local time, so India doesn't get an off-by-one day) ---------- */
function iso(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function todayISO() { return iso(new Date()); }
function addDays(dateStr, days) {
  var d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return iso(d);
}
function daysLeft(dateStr) {
  return Math.round((new Date(dateStr + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
}
function getStatus(dateStr) {
  var left = daysLeft(dateStr);
  if (left < 0) return "expired";
  if (left <= 7) return "expiring";
  return "active";
}
function prettyDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
function relativeExpiry(dateStr) {
  var left = daysLeft(dateStr);
  if (left < 0) return Math.abs(left) + (Math.abs(left) === 1 ? " day ago" : " days ago");
  if (left === 0) return "today";
  return "in " + left + (left === 1 ? " day" : " days");
}

var plans = {
  basic:   { name: "Basic",   price: 1200, days: 30, color: "#60a5fa" },

function planOf(id) { return plans[id] || { name: id || "—", price: 0, days: 30, color: "#8e8e96" }; }
function planOptions(selected) {
  return Object.keys(plans).map(function (id) {
    var p = plans[id];
    return '<option value="' + id + '"' + (id === selected ? " selected" : "") + '>' + p.name + ' — ' + money(p.price) + ' / ' + p.days + ' days</option>';
  }).join("");
}

/* ---------- State ---------- */
var members = [], trainers = [], payments = [];

/* ---------- Server calls ---------- */
function api(path, method, body) {
  return fetch(API_URL + path, {
    method: method || "GET",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: body ? JSON.stringify(body) : undefined
  }).catch(function () {
    throw new Error("Can't reach the server. Is server.js running?");
  }).then(function (res) {
    if (res.status === 401) {
      toast("Session expired — please log in again.", "error");
      setTimeout(function () { localStorage.removeItem("token"); window.location.replace("login.html"); }, 1200);
      throw new Error("unauthorized");
    }
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    });
  });
}

function handleError(err) {
  if (err && err.message !== "unauthorized") toast(err.message, "error");
}

function loadAll() {
  return Promise.all([api("/api/members"), api("/api/trainers"), api("/api/payments")])
    .then(function (r) {
      members = r[0]; trainers = r[1]; payments = r[2];
      renderAll();
    })
    .catch(handleError);
}

/* ---------- Toasts ---------- */
function toast(message, type) {
  var box = document.getElementById("toast-container");
  var el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = message;
  box.appendChild(el);
  setTimeout(function () {
    el.style.transition = "opacity 0.25s ease";
    el.style.opacity = "0";
    setTimeout(function () { el.remove(); }, 260);
  }, 3000);
}

/* ---------- Modal ---------- */
function closeModal() {
  var m = document.getElementById("modal");
  if (m) m.remove();
}

function openModal(opts) {
  closeModal();
  var wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.id = "modal";
  wrap.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div><h3>' + esc(opts.title) + '</h3>' + (opts.sub ? '<p>' + esc(opts.sub) + '</p>' : '') + '</div>' +
      '<button class="icon-btn" data-close title="Close">' + icon("x") + '</button></div>' +
      '<div class="modal-body">' + (opts.body || "") + '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn ghost" data-close>Cancel</button>' +
        '<button class="btn ' + (opts.danger ? "danger" : "primary") + '" id="modal-confirm">' + esc(opts.confirmText || "Save") + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);

  var confirmBtn = wrap.querySelector("#modal-confirm");

  wrap.addEventListener("click", function (e) {
    if (e.target === wrap || e.target.closest("[data-close]")) closeModal();
  });
  wrap.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox") confirmBtn.click();
  });

  confirmBtn.addEventListener("click", function () {
    confirmBtn.disabled = true;
    Promise.resolve()
      .then(opts.onConfirm)
      .then(function (result) { if (result !== false) closeModal(); })
      .catch(handleError)
      .finally(function () { confirmBtn.disabled = false; });
  });

  if (opts.onOpen) opts.onOpen(wrap);
  var first = wrap.querySelector("input, select");
  if (first) first.focus();
  return wrap;
}

document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

/* ---------- Dashboard ---------- */
function monthKey(dateStr) { return dateStr.slice(0, 7); }

function renderDashboard() {
  var total = payments.reduce(function (s, p) { return s + p.amount; }, 0);
  var thisMonthKey = todayISO().slice(0, 7);
  var thisMonth = payments.filter(function (p) { return monthKey(p.date) === thisMonthKey; })
                          .reduce(function (s, p) { return s + p.amount; }, 0);
  var activeCount = members.filter(function (m) { return getStatus(m.expires) !== "expired"; }).length;
  var attention = members.filter(function (m) { return getStatus(m.expires) !== "active"; });

  $("stats").innerHTML =
    statCard("orange", "users", "Total members", members.length, "", members.length ? activeCount + " currently valid" : "Add your first member") +
    statCard("green", "check", "Active memberships", activeCount, "", "Not yet expired") +
    statCard("amber", "alert", "Need attention", attention.length, "", "Expiring in 7 days or expired") +
    statCard("blue", "rupee", "Revenue this month", thisMonth, "money", money(total) + " all time");

  /* Revenue chart — last 6 months */
  var months = [];
  var now = new Date();
  for (var i = 5; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: iso(d).slice(0, 7), label: d.toLocaleDateString("en-IN", { month: "short" }), total: 0 });
  }
  payments.forEach(function (p) {
    months.forEach(function (m) { if (m.key === monthKey(p.date)) m.total += p.amount; });
  });
  var max = Math.max.apply(null, months.map(function (m) { return m.total; }).concat([1]));
  var sixTotal = months.reduce(function (s, m) { return s + m.total; }, 0);
  $("chart-total").textContent = money(sixTotal) + " total";
  $("chart").innerHTML = months.map(function (m, idx) {
    var pct = Math.round((m.total / max) * 100);
    var cls = "chart-bar" + (m.total === 0 ? " zero" : "") + (idx === months.length - 1 ? " current" : "");
    return '<div class="chart-col">' +
      '<div class="chart-val">' + (m.total ? money(m.total) : "") + '</div>' +
      '<div class="chart-bar-wrap"><div class="' + cls + '" style="height:' + (m.total ? Math.max(pct, 4) : 3) + '%" title="' + m.label + ': ' + money(m.total) + '"></div></div>' +
      '<div class="chart-label">' + m.label + '</div></div>';
  }).join("");

  /* Plan mix donut */
  var counts = {};
  members.forEach(function (m) { counts[m.plan] = (counts[m.plan] || 0) + 1; });
  var ids = Object.keys(counts);
  var gradient = "conic-gradient(var(--line-2) 0 100%)";
  if (members.length) {
    var acc = 0, stops = [];
    ids.forEach(function (id) {
      var start = acc;
      acc += (counts[id] / members.length) * 100;
      stops.push(planOf(id).color + " " + start + "% " + acc + "%");
    });
    gradient = "conic-gradient(" + stops.join(", ") + ")";
  }
  var legendIds = Object.keys(plans);
  ids.forEach(function (id) { if (legendIds.indexOf(id) === -1) legendIds.push(id); });
  $("donut").innerHTML =
    '<div class="donut" style="background:' + gradient + '"><div class="donut-hole"><b>' + members.length + '</b><span>members</span></div></div>' +
    '<div class="legend">' + legendIds.map(function (id) {
      return '<div class="legend-row"><span class="legend-dot" style="background:' + planOf(id).color + '"></span>' +
             esc(planOf(id).name) + '<span class="n">' + (counts[id] || 0) + '</span></div>';
    }).join("") + '</div>';

  /* Needs attention */
  var sorted = attention.slice().sort(function (a, b) { return daysLeft(a.expires) - daysLeft(b.expires); }).slice(0, 6);
  $("attention-list").innerHTML = sorted.length ? sorted.map(function (m) {
    var st = getStatus(m.expires);
    return '<div class="list-row">' + avatar(m.name) +
      '<div class="list-main"><b>' + esc(m.name) + '</b><small>' + (st === "expired" ? "Expired " : "Expires ") + relativeExpiry(m.expires) + '</small></div>' +
      '<span class="pill ' + st + '">' + st + '</span>' +
      '<button class="btn small" data-action="renew" data-id="' + m.id + '">' + icon("refresh", 13) + ' Renew</button></div>';
  }).join("") : emptyBox("🎉", "All clear", "No memberships expiring soon.");

  /* Recent payments */
  var recent = payments.slice().sort(function (a, b) { return b.id - a.id; }).slice(0, 5);
  $("recent-payments").innerHTML = recent.length ? recent.map(function (p) {
    var name = memberName(p.memberId);
    return '<div class="list-row">' + avatar(name) +
      '<div class="list-main"><b>' + esc(name) + '</b><small>' + prettyDate(p.date) + ' · ' + esc(p.mode) + '</small></div>' +
      '<span class="amount">' + money(p.amount) + '</span></div>';
  }).join("") : emptyBox("💸", "No payments yet", "Log one to see it here.");

  countUp();
}

function statCard(color, ic, label, value, format, sub) {
  return '<div class="stat-card"><div class="ico ' + color + '">' + icon(ic, 19) + '</div>' +
    '<div class="label">' + label + '</div>' +
    '<div class="value" data-count="' + value + '" data-format="' + format + '">' + (format === "money" ? money(value) : value) + '</div>' +
    '<div class="sub">' + esc(sub) + '</div></div>';
}

function countUp() {
  document.querySelectorAll("[data-count]").forEach(function (el) {
    var target = Number(el.dataset.count), isMoney = el.dataset.format === "money";
    if (!target) return;
    var start = performance.now(), dur = 700;
    function step(t) {
      var p = Math.min((t - start) / dur, 1), eased = 1 - Math.pow(1 - p, 3);
      var v = Math.round(target * eased);
      el.textContent = isMoney ? money(v) : v;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function emptyBox(emoji, title, text) {
  return '<div class="empty"><div class="big">' + emoji + '</div><b>' + esc(title) + '</b>' + esc(text) + '</div>';
}

function memberName(id) {
  var m = members.find(function (m) { return m.id === id; });
  return m ? m.name : "Deleted member";
}

/* ---------- Members ---------- */
function renderMembers() {
  var counts = { all: members.length, active: 0, expiring: 0, expired: 0 };
  members.forEach(function (m) { counts[getStatus(m.expires)]++; });

  $("member-chips").innerHTML = ["all", "active", "expiring", "expired"].map(function (f) {
    return '<button class="chip' + (state.filter === f ? " active" : "") + '" data-filter="' + f + '">' +
      f.charAt(0).toUpperCase() + f.slice(1) + '<em>' + counts[f] + '</em></button>';
  }).join("");

  var q = state.query.toLowerCase();
  var list = members.filter(function (m) {
    var matchesText = !q || m.name.toLowerCase().indexOf(q) !== -1 || String(m.phone || "").indexOf(q) !== -1;
    var matchesFilter = state.filter === "all" || getStatus(m.expires) === state.filter;
    return matchesText && matchesFilter;
  }).sort(function (a, b) { return daysLeft(a.expires) - daysLeft(b.expires); });

  var tbody = $("members-table");
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="5">' + (members.length
      ? emptyBox("🔍", "No matches", "Try a different search or filter.")
      : emptyBox("🏋️", "No members yet", "Click “Add member” to sign up your first one.")) + '</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(function (m) {
    var st = getStatus(m.expires), p = planOf(m.plan);
    return '<tr>' +
      '<td><div class="cell-person">' + avatar(m.name) + '<div><b>' + esc(m.name) + '</b><small>' + esc(m.phone || "No phone") + '</small></div></div></td>' +
      '<td><span class="plan-tag" style="color:' + p.color + ';border-color:' + p.color + '55">' + esc(p.name) + '</span></td>' +
      '<td>' + prettyDate(m.expires) + '<br><small class="muted">' + relativeExpiry(m.expires) + '</small></td>' +
      '<td><span class="pill ' + st + '">' + st + '</span></td>' +
      '<td class="actions">' +
        '<button class="btn small" data-action="renew" data-id="' + m.id + '">' + icon("refresh", 13) + ' Renew</button> ' +
        '<button class="icon-btn del" data-action="delete-member" data-id="' + m.id + '" title="Delete">' + icon("trash", 16) + '</button>' +
      '</td></tr>';
  }).join("");
}

/* ---------- Trainers ---------- */
function renderTrainers() {

    grid.innerHTML = '<div class="panel" style="grid-column:1/-1">' + emptyBox("💪", "No trainers yet", "Click “Add trainer” to build your team.") + '</div>';
    return;
  }
  grid.innerHTML = trainers.map(function (t) {
    return '<div class="trainer-card">' +
      '<button class="icon-btn del" data-action="delete-trainer" data-id="' + t.id + '" title="Remove">' + icon("trash", 16) + '</button>' +
      avatar(t.name) + '<h4>' + esc(t.name) + '</h4><p>' + esc(t.specialty || "General fitness") + '</p></div>';
  }).join("");
}

/* ---------- Payments ---------- */
function renderPayments() {
  var total = payments.reduce(function (s, p) { return s + p.amount; }, 0);
  var key = todayISO().slice(0, 7);
  var monthTotal = payments.filter(function (p) { return monthKey(p.date) === key; }).reduce(function (s, p) { return s + p.amount; }, 0);
  var upi = payments.filter(function (p) { return p.mode === "UPI"; }).length;

  $("payment-stats").innerHTML =
    '<div class="panel"><div class="label">Total collected</div><div class="value">' + money(total) + '</div></div>' +
    '<div class="panel"><div class="label">This month</div><div class="value">' + money(monthTotal) + '</div></div>' +
    '<div class="panel"><div class="label">Paid via UPI</div><div class="value">' + (payments.length ? Math.round((upi / payments.length) * 100) : 0) + '%</div></div>';

  var tbody = $("payments-table");
  if (!payments.length) {
    tbody.innerHTML = '<tr><td colspan="4">' + emptyBox("💸", "No payments yet", "Click “Log payment” to record one.") + '</td></tr>';
    return;
  }
  tbody.innerHTML = payments.slice().sort(function (a, b) { return b.id - a.id; }).map(function (p) {
    var name = memberName(p.memberId);
    return '<tr><td><div class="cell-person">' + avatar(name) + '<b>' + esc(name) + '</b></div></td>' +
      '<td class="amount">' + money(p.amount) + '</td>' +
      '<td>' + prettyDate(p.date) + '</td>' +
      '<td><span class="mode-tag">' + esc(p.mode) + '</span></td></tr>';
  }).join("");
}

function renderAll() {
  renderNav();
  renderHeader();
  renderDashboard();
  renderMembers();
  renderTrainers();
  renderPayments();
}

   ===================================================================== */
function go(page) {
  if (!PAGES[page]) page = "dashboard";
  state.page = page;
  history.replaceState(null, "", "#" + page);
  document.querySelectorAll(".page").forEach(function (p) { p.classList.remove("active"); });
  $("page-" + page).classList.add("active");
  renderNav();
  renderHeader();
  if (page === "dashboard") countUp();
}

      '<div class="field"><label>Full name</label><input id="f-name" placeholder="e.g. Arun Kumar" maxlength="60"></div>' +
      '<div class="field"><label>Phone</label><input id="f-phone" placeholder="e.g. 98765 43210" maxlength="20" inputmode="tel"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Plan</label><select id="f-plan">' + planOptions("basic") + '</select></div>' +
        '<div class="field"><label>Payment mode</label><select id="f-mode"><option>UPI</option><option>Cash</option><option>Card</option></select></div>' +
      '</div>' +
      '<label class="check"><input type="checkbox" id="f-pay" checked> <span id="f-pay-label"></span></label>',
    onOpen: function (wrap) {
      function sync() {
        var p = planOf(wrap.querySelector("#f-plan").value);
        wrap.querySelector("#f-pay-label").textContent = "Record first payment of " + money(p.price);
      }
      wrap.querySelector("#f-plan").addEventListener("change", sync);
      sync();
    },
    onConfirm: function () {
      var name = $("f-name").value.trim();
      var phone = $("f-phone").value.trim();
      var planId = $("f-plan").value;
      var mode = $("f-mode").value;
      var pay = $("f-pay").checked;

      if (!name) { toast("Please enter a name.", "error"); return false; }

      var plan = planOf(planId);
      return api("/api/members", "POST", { name: name, phone: phone, plan: planId, expires: addDays(todayISO(), plan.days) })
        .then(function (member) {
          if (pay) return api("/api/payments", "POST", { memberId: member.id, amount: plan.price, mode: mode });
        })
        .then(function () { toast(name + " added.", "success"); return loadAll(); });
    }
  });
}

function renewModal(id) {
  var m = members.find(function (x) { return x.id === id; });
  if (!m) return;

  openModal({
    title: "Renew membership",
    sub: m.name,
    confirmText: "Renew & log payment",
    body:
      '<div class="field-row">' +
        '<div class="field"><label>Plan</label><select id="f-plan">' + planOptions(plans[m.plan] ? m.plan : "basic") + '</select></div>' +
        '<div class="field"><label>Payment mode</label><select id="f-mode"><option>UPI</option><option>Cash</option><option>Card</option></select></div>' +
      '</div>' +
      '<div class="field"><label>Amount (₹)</label><input id="f-amount" type="number" min="1"></div>' +
      '<div class="info-box" id="f-info"></div>',
    onOpen: function (wrap) {
      function newExpiry() {
        var base = m.expires > todayISO() ? m.expires : todayISO();   // extend from today if already expired
        return addDays(base, planOf(wrap.querySelector("#f-plan").value).days);
      }
      function sync() {
        wrap.querySelector("#f-amount").value = planOf(wrap.querySelector("#f-plan").value).price;
        wrap.querySelector("#f-info").innerHTML = "New expiry date: <b>" + prettyDate(newExpiry()) + "</b>";
      }
      wrap.querySelector("#f-plan").addEventListener("change", sync);
      wrap.newExpiry = newExpiry;
      sync();
    },
    onConfirm: function () {
      var wrap = $("modal");
      var planId = $("f-plan").value;
      var amount = Number($("f-amount").value);
      var mode = $("f-mode").value;
      if (!amount || amount <= 0) { toast("Enter a valid amount.", "error"); return false; }

      return api("/api/members/" + m.id, "PUT", { plan: planId, expires: wrap.newExpiry() })
        .then(function () { return api("/api/payments", "POST", { memberId: m.id, amount: amount, mode: mode }); })
        .then(function () { toast(m.name + " renewed.", "success"); return loadAll(); });
    }
  });
}

function addPaymentModal() {
  if (!members.length) { toast("Add a member first.", "error"); return; }
  openModal({
    title: "Log payment",
    confirmText: "Log payment",
    body:
      '<div class="field"><label>Member</label><select id="f-member">' +
        members.map(function (m) { return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Amount (₹)</label><input id="f-amount" type="number" min="1"></div>' +
        '<div class="field"><label>Mode</label><select id="f-mode"><option>UPI</option><option>Cash</option><option>Card</option></select></div>' +
      '</div>',
    onOpen: function (wrap) {
      function sync() {
        var m = members.find(function (x) { return x.id === Number(wrap.querySelector("#f-member").value); });
        wrap.querySelector("#f-amount").value = m ? planOf(m.plan).price || "" : "";
      }
      wrap.querySelector("#f-member").addEventListener("change", sync);
      sync();
    },
    onConfirm: function () {
      var memberId = Number($("f-member").value);
      var amount = Number($("f-amount").value);
      if (!amount || amount <= 0) { toast("Enter a valid amount.", "error"); return false; }
      return api("/api/payments", "POST", { memberId: memberId, amount: amount, mode: $("f-mode").value })
        .then(function () { toast("Payment logged.", "success"); return loadAll(); });
    }
  });
}

function addTrainerModal() {
  openModal({
    title: "Add trainer",
    confirmText: "Add trainer",
    body:
      '<div class="field"><label>Full name</label><input id="f-name" placeholder="e.g. Priya Sharma" maxlength="60"></div>' +
      '<div class="field"><label>Specialty</label><input id="f-specialty" placeholder="e.g. Strength & conditioning" maxlength="60"></div>',
    onConfirm: function () {
      var name = $("f-name").value.trim();
      if (!name) { toast("Please enter a name.", "error"); return false; }
      return api("/api/trainers", "POST", { name: name, specialty: $("f-specialty").value.trim() })
        .then(function () { toast(name + " added.", "success"); return loadAll(); });
    }
  });
}

function confirmDelete(kind, id) {
  var list = kind === "member" ? members : trainers;
  var item = list.find(function (x) { return x.id === id; });
  if (!item) return;
  openModal({
    title: "Remove " + kind + "?",
    sub: item.name + " will be removed permanently.",
    confirmText: "Yes, remove",
    danger: true,
    body: kind === "member" ? '<div class="info-box">Their past payments stay in your records.</div>' : "",
    onConfirm: function () {
      return api("/api/" + kind + "s/" + id, "DELETE")
        .then(function () { toast(item.name + " removed.", "success"); return loadAll(); });
    }
  });
}

/* =====================================================================
   EVENTS — one listener handles every button on the page
   ===================================================================== */
document.addEventListener("click", function (e) {
  var go_ = e.target.closest("[data-go]");
  if (go_) { go(go_.dataset.go); return; }

  var chip = e.target.closest("[data-filter]");
  if (chip) { state.filter = chip.dataset.filter; renderMembers(); return; }

  var btn = e.target.closest("[data-action]");
  if (!btn) return;
  var id = Number(btn.dataset.id);

  switch (btn.dataset.action) {
    case "add-member":     addMemberModal(); break;
    case "add-trainer":    addTrainerModal(); break;
    case "add-payment":    addPaymentModal(); break;
    case "renew":          renewModal(id); break;
    case "delete-member":  confirmDelete("member", id); break;
    case "delete-trainer": confirmDelete("trainer", id); break;
  }
});

$("member-search").addEventListener("input", function (e) {
  state.query = e.target.value.trim();
  renderMembers();
});

$("logout-btn").addEventListener("click", logout);
$("logout-btn").innerHTML = icon("logout", 18);
$("brand-icon").innerHTML = icon("dumbbell", 21);
$("search-icon").innerHTML = icon("search", 17);

/* ---------- Start ---------- */
state.page = (location.hash || "#dashboard").slice(1);
if (!PAGES[state.page]) state.page = "dashboard";
document.querySelectorAll(".page").forEach(function (p) { p.classList.remove("active"); });
$("page-" + state.page).classList.add("active");
renderAll();
loadAll();
</script>

<script src="chatbot.js"></script>

</body>
</html>
